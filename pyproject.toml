[project]
name = "musbi-backend"
version = "0.1.0"
description = "Backend service for musbi agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "aiosqlite",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "tenacity",
    "celery",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]
